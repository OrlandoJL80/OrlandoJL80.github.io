<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>THE PALE MARCH</title>
  <link rel="stylesheet" href="css/tape.css" />
</head>
<body>
  <div id="boot" class="overlay">
    <div class="boot-card" id="boot-card"></div>
  </div>

  <div id="app" class="hidden">
    <header id="topbar">
      <div class="brand">THE PALE MARCH<small>RECOVERED REEL</small></div>
      <div class="vfd" id="place-name">THE BLACK ROAD</div>
      <div class="status-pills">
        <div class="pill on" id="pill-food">FOOD 12</div>
        <div class="pill on" id="pill-oil">OIL 8</div>
        <div class="pill on" id="pill-miles">MILES 0</div>
        <div class="pill on" id="pill-party">PARTY 4</div>
      </div>
    </header>

    <section id="stage">
      <div class="monitor">
        <div class="monitor-meta">
          <span id="reel-id">REEL  •  DAY 4</span>
          <span class="tally">REC</span>
        </div>
        <div class="screen-wrap">
          <div class="screen" id="tape">
            <div class="scene ken" id="tape-scene"></div>
            <div class="scanlines"></div>
            <div class="vignette"></div>
            <div class="noise"></div>
            <div class="flash" id="tape-flash"></div>
            <div class="scare" id="tape-scare"></div>
            <div class="cc" id="tape-cc"></div>
            <div class="crawl-wrap" id="tape-crawl-wrap"><div class="crawl-text" id="tape-crawl"></div></div>
          </div>
        </div>
        <div class="src-label" id="tape-label">THE BLACK ROAD</div>
      </div>

      <aside id="die-tray">
        <div class="die-label">CHECK</div>
        <div class="die" id="die">—</div>
        <div class="die-need" id="die-need">d20</div>
        <div class="die-mod" id="die-mod"></div>
        <div class="die-result" id="die-result"></div>
      </aside>
    </section>

    <section id="desk">
      <div class="panel">
        <h3>THE REEL</h3>
        <div id="story"></div>
      </div>
      <div class="panel">
        <h3>MARCH LOG</h3>
        <div id="log"></div>
        <div class="party-line" id="party-line"></div>
      </div>
    </section>

    <form id="move-form" autocomplete="off">
      <label for="move">WHAT DO YOU DO</label>
      <input id="move" maxlength="140" placeholder="Type the attempt. The die decides if it holds." />
      <button type="submit" id="btn-go">ROLL</button>
    </form>
  </div>

  <div id="cut" class="overlay hidden">
    <div class="cut-snow"></div>
    <div class="cut-page" id="cut-page"></div>
  </div>
  <div id="end" class="overlay hidden">
    <div class="end-card" id="end-card"></div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
