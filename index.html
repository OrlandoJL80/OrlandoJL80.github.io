<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>WQRT-12 — PROVINCIAL SURVEY</title>
  <link rel="stylesheet" href="css/station.css" />
</head>
<body>
  <div id="boot" class="overlay">
    <div class="boot-card" id="boot-card"></div>
  </div>

  <div id="app" class="hidden">
    <header id="topbar">
      <div class="brand">WQRT-12<small>PROVINCIAL SURVEY 1979</small></div>
      <div class="vfd" id="page-num">PAGE 12</div>
      <div class="status-pills">
        <div class="pill on" id="pill-food">FOOD 12</div>
        <div class="pill on" id="pill-oil">OIL 8</div>
        <div class="pill on" id="pill-miles">MILES 0</div>
        <div class="pill on" id="pill-party">PARTY 4</div>
        <div class="pill" id="pill-tape">TAPE</div>
      </div>
    </header>

    <section id="tape-row">
      <div class="monitor" id="mon-tape">
        <div class="monitor-meta">
          <span id="tape-id">VTR 2  •  SURVEY REEL</span>
          <span class="tally hot">REC</span>
        </div>
        <div class="screen-wrap">
          <div class="screen" id="tape">
            <div class="scene ken" id="tape-scene"></div>
            <div class="scanlines"></div>
            <div class="vignette"></div>
            <div class="noise"></div>
            <div class="flash" id="tape-flash"></div>
            <div class="scare" id="tape-scare"></div>
            <div class="cc" id="tape-cc"></div>
            <div class="crawl-wrap" id="tape-crawl-wrap"><div class="crawl-text" id="tape-crawl"></div></div>
            <div class="page-burn" id="page-burn">P.12</div>
          </div>
        </div>
        <div class="src-label" id="tape-label">DAY 4  •  THE ROAD</div>
      </div>
    </section>

    <section id="desk">
      <div class="panel story-panel">
        <h3>THE PRINTING</h3>
        <div id="story"></div>
      </div>
      <div class="panel">
        <h3>SURVEY LOG</h3>
        <div id="log"></div>
        <div class="party-line" id="party-line"></div>
      </div>
    </section>

    <form id="move-form" autocomplete="off">
      <label for="move">WHAT DO YOU DO</label>
      <input id="move" maxlength="140" placeholder="Type anything. The tape will try it." />
      <button type="submit" id="btn-go">TURN THE PAGE</button>
    </form>
  </div>

  <div id="cut" class="overlay hidden">
    <div class="cut-snow"></div>
    <div class="cut-page" id="cut-page">TURN TO PAGE 12</div>
  </div>
  <div id="end" class="overlay hidden">
    <div class="end-card" id="end-card"></div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
